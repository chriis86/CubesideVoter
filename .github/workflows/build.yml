name: APK bauen

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.14.3

      - name: APK bauen
        run: gradle assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: CubesideVoter-APK
          path: build/outputs/apk/debug/*.apk

      - name: Als Release veröffentlichen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp build/outputs/apk/debug/*.apk CubesideVoter.apk
          gh release delete neueste -y --cleanup-tag || true
          gh release create neueste CubesideVoter.apk --title "Cubeside Voter (neueste Version)" --notes "APK herunterladen und installieren." --target ${{ github.sha }}
