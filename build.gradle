plugins {
    id 'com.android.application' version '8.7.3'
}

android {
    namespace 'de.cubevote'
    compileSdk 34

    defaultConfig {
        applicationId 'de.cubevote'
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }

    // Fester Schlüssel: so kannst du neue Versionen einfach drüber installieren
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
